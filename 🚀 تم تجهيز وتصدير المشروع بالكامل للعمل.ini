🚀 تم تجهيز وتصدير المشروع بالكامل للعمل على Google Cloud Console & Workstations
تم إضافة كافة إعدادات التصدير وبناء الحاويات (Docker & Cloud Build) وأدوات النشر التلقائي للعمل المباشر داخل بيئة Google Cloud Platform (GCP).
📂 الملفات المضافة والتكوينات الجاهزة للعمل على GCP:
Dockerfile: حاوية متعددة المراحل (Multi-stage build) قائمة على Node.js 20 وجاهزة للتشغيل.
cloudbuild.yaml: ملف أتمتة النشر عبر Google Cloud Build.
deploy-to-gcp.sh: نص برمجي قابل للتنفيذ للنشر بضغطة زر واحدة من Cloud Shell.
.dockerignore: تسريع عمليات البناء والنشر واستبعاد الملفات المؤقتة.
docs/GCP_EXPORT_GUIDE.md: دليل إرشادي مفصل باللغة العربية للتشغيل والتطوير.
🛠️ طرق التشغيل والتطوير داخل Google Cloud Console:
1️⃣ عبر Google Cloud Shell & Cloud Shell Editor (مباشر ومجاني)
افتح لوحة تحكم جوجل كلاود: Google Cloud Console
افتح Cloud Shell (زر >_ أعلى اليمين) أو افتح Cloud Shell Editor.
انزل بسورس كود المشروع ثم شغل:
code
Bash
npm install
npm run dev
انقر على Web Preview واكتب المنفذ 3000 لمعاينة التطبيق مباشرة داخل المتصفح.
2️⃣ عبر Google Cloud Workstations (بيئة VS Code كاملة على السحابة)
من القائمة الجانبية في Google Cloud Console 👈 اختر Cloud Workstations.
أنشئ بيئة Code-OSS (VS Code).
افتح المجلد واستخدم الـ Terminal المدمج للتطوير والتعديل السحابي الفوري.
3️⃣ النشر الفوري المباشر بضغطة زر على Google Cloud Run
داخل نافذة Cloud Shell، نفّذ الأمر التالي فقط:
code
Bash
bash deploy-to-gcp.sh
سيقوم النص البرمجي بتفعيل واجهات GCP اللازمة ونشر المشروع على رابط إنتاجي معزول ومزود بشهادة SSL تلقائياً (https://...a.run.app).
