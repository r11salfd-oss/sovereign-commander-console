jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Shift-Left Sovereign Quality Gates
  # ----------------------------------------------------------------------------
  quality-gates:
    name: Sovereign Quality Gate Pipeline (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Hardened: explicit ceiling so a hung step cannot burn the runner budget.
    timeout-minutes: 20
    # Hardened: read-only token. This job never writes to the repository.
    permissions:
      contents: read
    strategy:
      # fail-fast: false -> a failure on one Node version still reports the other,
      # so a version-specific break is diagnosable from one run.
      fail-fast: false
      matrix:
        # NOTE: package.json declares NO `engines` field, so there is no
        # authoritative supported range to read. The project targets Node 22 in
        # the previous workflow and the local/authoring runtime is Node 24.19.0,
        # so both maintained LTS lines are exercised. RECOMMENDED FOLLOW-UP for
        # the orchestrator: add an `engines` block to package.json and drive this
        # matrix from it, so the supported range stops being an inference.
        node: [ '22.x', '24.x' ]

    steps:
      - name: 🛡️ Checkout Source Code
        # Pinned by SHA. `git ls-remote https://github.com/actions/checkout refs/tags/v5`
        #   -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  (refs/tags/v5)
        # Verified `runs.using: node24` at this SHA, which clears the
        # "Node.js 20 is deprecated" warning that refs/tags/v4 still emitted.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup Node.js Runtime (${{ matrix.node }})
        # Pinned by SHA. `git ls-remote https://github.com/actions/setup-node refs/tags/v5`
        #   -> a0853c24544627f65ddf259abe73b1d18a591444  (refs/tags/v5)
        # Verified `runs.using: 'node24'` at this SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: 🐍 Setup Python Runtime (v3.12)
        # Pinned by SHA. `git ls-remote https://github.com/actions/setup-python refs/tags/v6`
        #   -> ece7cb06caefa5fff74198d8649806c4678c61a1  (refs/tags/v6)
        # Verified `runs.using: 'node24'` at this SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # `npm ci` stays STRICT on purpose.
      # `--legacy-peer-deps` is deliberately NOT used: it is exactly what makes a
      # Dependabot major bump (e.g. @vitejs/plugin-react demanding peer vite ^8
      # against a project pinning vite ^6) install "successfully" while the tree
      # is genuinely incompatible. A real peer conflict must fail loudly here.
      - name: '📦 Install Project Dependencies (strict peer resolution)'
        run: npm ci

      - name: '🔍 Gate 1: TypeScript Integrity Check (tsc --noEmit)'
        run: npx tsc --noEmit

      - name: '⚖️ Gate 2: Sovereign Master Test Matrix (10 Automated Suites)'
        run: python scripts/run_sovereign_tests.py
        env:
          CHAIN_KEY_ID: "360ea36c28e66d9d"

      # ----------------------------------------------------------------------------
      # Gate 3 — SUPPLY-CHAIN VULNERABILITY AUDIT (ENFORCED)
      # ----------------------------------------------------------------------------
      # REPLACES the decorative step that read:
      #     npm audit --audit-level=high || echo "⚠️ Security audit completed ..."
      # The `|| echo` consumed npm's non-zero exit code, so this step reported
      # SUCCESS on every run while printing genuine high/critical advisories.
      #
      # `set +e` / `set -e` is used to CAPTURE npm's exit code for reporting. It is
      # NOT a swallow: the captured code is printed, and the policy decision
      # (fail on any new / stale / expired high-or-critical entry) is enforced
      # immediately afterwards by the inline verifier, which exits non-zero.
      # There is no `|| true` and no `|| echo` anywhere in this gate.
      - name: '🔒 Gate 3: Supply-Chain Vulnerability Audit (ENFORCED, baseline-backed)'
        run: |
          set +e
          npm audit --json > npm-audit.json
          AUDIT_EXIT=$?
          set -e
          echo "npm audit raw exit code: ${AUDIT_EXIT}"
          echo "----------------------------------------------------------------------"
          python - <<'PY'
          import datetime, json, os, sys

          AUDIT_FILE = "npm-audit.json"
          BLOCKING = {"critical", "high"}
          TODAY = datetime.date.today()

          print("=" * 78)
          print(" SOVEREIGN SUPPLY-CHAIN ADVISORY GATE (Chain Key 360ea36c28e66d9d)")
          print("=" * 78)

          if not os.path.exists(AUDIT_FILE):
              print(" [BLOCKED] %s was not produced; npm audit did not complete." % AUDIT_FILE)
              sys.exit(1)

          raw = open(AUDIT_FILE, encoding="utf-8").read().strip()
          if not raw:
              print(" [BLOCKED] npm audit produced empty output (registry unreachable?).")
              print("          An unreachable registry is NOT a pass. Resolve the network")
              print("          or the audit endpoint, then re-run. Failing closed.")
              sys.exit(1)

          try:
              data = json.loads(raw)
          except Exception as exc:
              print(" [BLOCKED] npm audit output was not valid JSON: %s" % exc)
              sys.exit(1)

          vuln_meta = data.get("metadata", {}).get("vulnerabilities", {})
          print(" Advisory counts reported by npm: %s" % json.dumps(vuln_meta, sort_keys=True))

          # Build the set of DISTINCT high/critical ADVISORY IDENTIFIERS (GHSA URLs).
          # Advisory URL is the true identity of an advisory; a package name is too
          # coarse (a new advisory in an already-listed package must still block).
          current = {}
          for pkg, entry in (data.get("vulnerabilities") or {}).items():
              for via in entry.get("via", []):
                  if isinstance(via, dict):
                      url = via.get("url")
                      sev = str(via.get("severity") or "").lower()
                      if url and sev in BLOCKING:
                          current[url] = sev

          try:
              baseline = json.loads(os.environ["SOVEREIGN_AUDIT_BASELINE"])
          except Exception as exc:
              print(" [BLOCKED] SOVEREIGN_AUDIT_BASELINE is missing or unparseable: %s" % exc)
              print("          The ledger is the gate. Without it there is no policy.")
              sys.exit(1)

          print(" Blocking-severity advisories currently open : %d" % len(current))
          print(" Blocking-severity advisories in the ledger   : %d" % len(baseline))

          new     = sorted(set(current) - set(baseline))
          stale   = sorted(set(baseline) - set(current))
          expired = sorted(
              u for u in (set(current) & set(baseline))
              if datetime.date.fromisoformat(baseline[u]["expires"]) < TODAY
          )

          print()
          print("--- NON-BLOCKING SEVERITIES (reported, not enforced) ---")
          for sev in ("moderate", "low", "info"):
              count = vuln_meta.get(sev, 0)
              if count:
                  print("  %-9s %d" % (sev, count))
          print("  Policy: moderate/low are ADVISORY ONLY. They are counted and printed")
          print("  so they cannot be quietly forgotten, but they do not block, because")
          print("  blocking on them today would mean a permanently red pipeline that")
          print("  gets ignored - which is how the original `|| echo` gate happened.")

          failed = False

          print()
          if new:
              failed = True
              print(" [BLOCKED] %d NEW high/critical advisory(ies) not in the ledger:" % len(new))
              for u in new:
                  print("   - [%s] %s" % (current[u], u))
              print("          These are genuinely new findings. Fix them, or add a ledger")
              print("          entry with a reason, an owner and an expiry date.")

          if stale:
              failed = True
              print(" [BLOCKED] %d ledger entr(ies) no longer reported by npm audit:" % len(stale))
              for u in stale:
                  print("   - %s (was %s)" % (u, baseline[u].get("package")))
              print("          These are FIXED upstream. Remove them from the ledger.")
              print("          A ledger that cannot shrink is a permanent rubber stamp.")

          if expired:
              failed = True
              print(" [BLOCKED] %d ledger entr(ies) PAST THEIR EXPIRY DATE:" % len(expired))
              for u in expired:
                  e = baseline[u]
                  print("   - %s (%s) expired %s" % (u, e.get("package"), e.get("expires")))
              print("          The expiry is enforced. Remediate, or re-baseline with a")
              print("          written justification and a new date.")

          print()
          if failed:
              print(" RESULT: GATE 3 FAILED. Supply-chain policy is NOT satisfied.")
              print("=" * 78)
              sys.exit(1)

          print(" RESULT: GATE 3 PASSED.")
          print("   - no new high/critical advisories beyond the enforced ledger")
          print("   - ledger is current (no stale entries)")
          print("   - no ledger entry is past its expiry date")
          print("=" * 78)
          PY

      - name: '🧾 Gate 4: Registry Provenance & Signature Verification'
        # Provenance half of the supply-chain gate: `npm audit` reports KNOWN
        # advisories; this step detects a package whose published artifact does
        # not match what the registry signs for. Requires npm >= 9.5.0
        # (npm audit signatures). Verified locally on npm 11.17.0:
        #   "audited 618 packages / 618 packages have verified registry signatures"
        # This step is NOT given `continue-on-error`: an unverifiable artifact is
        # a failed provenance check, not a skipped one.
        run: npm audit signatures

      - name: '🗂️ Gate 5: Dual-Lockfile Integrity (npm vs bun)'
        # The repository carries BOTH package-lock.json and bun.lock at the root.
        # CI installs from npm only, so a local Bun workflow can silently resolve a
        # DIFFERENT dependency tree than the one this pipeline verifies.
        #
        # Measured 2026-10-02 (read-only comparison of both lockfiles):
        #   31 direct dependencies in package.json
        #     28 present in BOTH lockfiles at an identical version
        #      2 MISSING from bun.lock  : cross-env, puppeteer-core
        #      1 VERSION MISMATCH       : esbuild  npm=0.28.0  bun=0.25.12
        #   (a deeper comparison also shows 41 transitive version mismatches
        #    including every @esbuild/* platform binary, plus 88 entries present
        #    only in bun.lock - so bun.lock is both stale AND divergent)
        #
        # `esbuild` produces the production server bundle. npm and bun disagree
        # about which esbuild builds it. That is precisely the supply-chain hole
        # this gate exists to close, so it is BLOCKING.
        #
        # REMEDIATION (orchestrator decision, deliberately NOT taken here):
        #   either delete bun.lock and standardise on npm, or regenerate it under
        #   review and then update the ledger. Regenerating a lockfile produces a
        #   very large unreviewed diff and is out of scope for this change.
        run: |
          python - <<'PY'
          import json, os, re, sys

          print("=" * 78)
          print(" SOVEREIGN DUAL-LOCKFILE INTEGRITY GATE")
          print("=" * 78)

          def read_jsonc(path):
              text = open(path, encoding="utf-8").read()
              text = re.sub(r"^\s*//.*$", "", text, flags=re.M)
              text = re.sub(r",(\s*[}\]])", r"\1", text)
              return json.loads(text)

          try:
              pkg = json.load(open("package.json", encoding="utf-8"))
          except Exception as exc:
              print(" [BLOCKED] cannot read package.json: %s" % exc)
              sys.exit(1)

          npm_lock, bun_lock = "package-lock.json", "bun.lock"
          if not os.path.exists(npm_lock):
              print(" [BLOCKED] missing %s - CI would install from an unresolved tree." % npm_lock)
              sys.exit(1)
          if not os.path.exists(bun_lock):
              print(" no %s present: single-lockfile repository, gate passes." % bun_lock)
              print("=" * 78)
              sys.exit(0)

          npmv = {}
          for path, meta in (json.load(open(npm_lock, encoding="utf-8")).get("packages") or {}).items():
              if path and "version" in meta:
                  npmv[path.split("node_modules/")[-1]] = meta["version"]

          bunv = {}
          for name, entry in (read_jsonc(bun_lock).get("packages") or {}).items():
              if isinstance(entry, list) and entry and isinstance(entry[0], str) and "@" in entry[0]:
                  bunv[name] = entry[0].rsplit("@", 1)[1]

          direct = {}
          for section in ("dependencies", "devDependencies"):
              for name, rng in (pkg.get(section) or {}).items():
                  direct[name] = (section, rng)

          missing, mismatch = [], []
          for name, (section, rng) in sorted(direct.items()):
              a, b = npmv.get(name), bunv.get(name)
              if b is None:
                  missing.append((name, section, rng, a))
              elif a != b:
                  mismatch.append((name, section, rng, a, b))

          print(" Direct dependencies declared in package.json : %d" % len(direct))
          print(" Present in BOTH lockfiles at identical version: %d"
                % (len(direct) - len(missing) - len(mismatch)))
          print(" MISSING from bun.lock                        : %d" % len(missing))
          print(" VERSION MISMATCH between lockfiles           : %d" % len(mismatch))

          if not missing and not mismatch:
              print()
              print(" RESULT: GATE 5 PASSED - both lockfiles resolve every direct dependency")
              print("         to the same version.")
              print("=" * 78)
              sys.exit(0)

          print()
          for name, section, rng, a in missing:
              print(" [BLOCKED] %-24s (%s) declared %s but ABSENT from bun.lock "
                    "(package-lock has %s) -> bun.lock is stale" % (name, section, rng, a))
          for name, section, rng, a, b in mismatch:
              print(" [BLOCKED] %-24s (%s) declared %s resolves to npm=%s but bun=%s "
                    "-> the two trees disagree" % (name, section, rng, a, b))
          print()
          print(" RESULT: GATE 5 FAILED.")
          print(" A Bun-based local workflow does not produce the dependency tree this")
          print(" pipeline verifies. Resolve by deleting bun.lock (standardise on npm)")
          print(" or regenerating it under review - an orchestrator decision.")
          print("=" * 78)
          sys.exit(1)
          PY

      - name: '🏗️ Gate 6: Production Build Verification (Vite + esbuild)'
        run: npm run build

      # ----------------------------------------------------------------------------
      # Workflow self-verification: prove the gates themselves are wired up.
      # ----------------------------------------------------------------------------
      # Parses this workflow with a real YAML parser and asserts the gate
      # structure is present. This is what stops a future edit from quietly
      # deleting a gate: the assertions below FAIL if a gate step disappears.
      - name: '🧾 Gate 7: Workflow Integrity Self-Verification (YAML parse + gate assertions)'
        run: |
          python - <<'PY'
          import sys

          try:
              import yaml
          except ImportError:
              print(" [UNVERIFIED] PyYAML unavailable; cannot self-verify the workflow.")
              print("            Install with: python -m pip install pyyaml")
              sys.exit(1)

          with open(".github/workflows/ci.yml", encoding="utf-8") as fh:
              wf = yaml.safe_load(fh)

          # NOTE: YAML 1.1 parses the bare key `on` as the BOOLEAN True.
          # Accept either representation so this assertion is parser-agnostic.
          triggers = wf.get(True, wf.get("on"))
          if not isinstance(triggers, dict):
              print(" [BLOCKED] workflow has no parsable trigger block (on:)")
              sys.exit(1)
          print(" Trigger keys parsed: %s" % sorted(triggers.keys()))

          jobs = wf.get("jobs") or {}
          steps = jobs["quality-gates"]["steps"]
          names = [str(s.get("name", "")) for s in steps]

          # Assert each gate by its EXACT marker "Gate N:" rather than a bare
          # "Gate N" substring. A bare substring match is defeatable by leaving the
          # token in an unrelated step name (e.g. renaming a step to
          # "REMOVED Gate 5 step" would satisfy it). Requiring the colon means a
          # genuinely deleted gate step cannot be masked.
          required = ["Gate %d:" % n for n in range(1, 8)]
          absent = [g for g in required if not any(g in n for n in names)]
          if absent:
              print(" [BLOCKED] missing gate step(s): %s" % ", ".join(absent))
              print("            present steps: %s" % names)
              sys.exit(1)
          print(" All %d gate steps present." % len(required))

          # Every `uses:` must be a full 40-hex commit SHA. A mutable tag is a
          # supply-chain hole, so it is asserted here rather than trusted.
          import re
          SELF_STEP_NAME = (
              "\U0001f9fe Gate 7: Workflow Integrity Self-Verification "
              "(YAML parse + gate assertions)"
          )
          sha = re.compile(r"^[0-9a-f]{40}$")
          bad = []
          for job_name, job in jobs.items():
              for step in job.get("steps") or []:
                  uses = step.get("uses")
                  if not uses:
                      continue
                  ref = uses.split("@", 1)[1] if "@" in uses else ""
                  if not sha.match(ref):
                      bad.append("%s -> %s" % (job_name, uses))
          if bad:
              print(" [BLOCKED] action(s) not pinned to a full commit SHA:")
              for b in bad:
                  print("   %s" % b)
              sys.exit(1)
          print(" Every `uses:` reference is pinned to a 40-char commit SHA.")

          # The decorative-gate pattern must never come back. Three precision rules make
          # this check meaningful instead of self-defeating:
          #   (1) COMMENT LINES ARE STRIPPED before matching. This workflow quotes
          #       the old defective command (`... || echo "..."`) as forensic
          #       record; a comment cannot swallow an exit code, so it is not a
          #       violation.
          #   (2) QUOTED SEGMENTS ARE STRIPPED before matching. The banned text
          #       also appears inside Python/shell STRING LITERALS (for example
          #       this gate's own diagnostic prose inside a print()). Text inside
          #       quotes is data, not a shell operator, so it must not match.
          #   (3) THIS STEP IS EXCLUDED from its own scan, because its source
          #       necessarily contains the banned literals.
          # What remains after (1) and (2) is executable shell/python, so a match
          # there is a genuine attempt to swallow a non-zero exit code.
          banned = ("|| echo", "|| true")
          quoted = re.compile(r"\"[^\"]*\"|'[^']*'")
          offenders = []
          for job_name, job in jobs.items():
              for step in job.get("steps") or []:
                  if step.get("name") == SELF_STEP_NAME:
                      continue
                  run = step.get("run")
                  if not isinstance(run, str):
                      continue
                  for lineno, line in enumerate(run.splitlines(), 1):
                      if line.lstrip().startswith("#"):
                          continue
                      executable = quoted.sub("", line)
                      for pattern in banned:
                          if pattern in executable:
                              offenders.append("%s / %s line %d -> %s"
                                               % (job_name, step.get("name", "?"), lineno, pattern))
          if offenders:
              print(" [BLOCKED] failure-swallowing pattern on an executable line:")
              for o in offenders:
                  print("   %s" % o)
              sys.exit(1)
          print(" No `|| echo` / `|| true` on any executable line of any other step.")

          for job_name, job in jobs.items():
              if "timeout-minutes" not in job:
                  print(" [BLOCKED] job %s has no timeout-minutes" % job_name)
                  sys.exit(1)
              if "permissions" not in job:
                  print(" [BLOCKED] job %s has no least-privilege permissions block" % job_name)
                  sys.exit(1)
          print(" Every job declares timeout-minutes and a permissions block.")

          print()
          print(" RESULT: GATE 7 PASSED - workflow structure is intact and pinned.")
          PY

      - name: '📤 Archive Production Artifacts'
        # Pinned by SHA. `git ls-remote https://github.com/actions/upload-artifact refs/tags/v7`
        #   -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  (refs/tags/v7)
        # Verified `runs.using: 'node24'` at this SHA, and that the `name`, `path`
        # and `retention-days` inputs used here are all still declared by this
        # major (refs/tags/v5 was still node20 and would not have cleared it).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sovereign-dist-bundle-node${{ matrix.node }}
          path: dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 2: Container Image Build Verification
  # ----------------------------------------------------------------------------
  container-verification:
    name: Container Integrity & Dockerfile Check
    runs-on: ubuntu-latest
    needs: quality-gates
    # Hardened: explicit ceiling.
    timeout-minutes: 15
    # Hardened: read-only repo, plus the `actions` scope required to read/write the
    # GitHub Actions layer cache used by cache-from/cache-to below.
    permissions:
      contents: read
      actions: write

    steps:
      - name: 🛡️ Checkout Source Code
        # Same pinned SHA as Job 1.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 🐳 Set up Docker Buildx
        # Pinned by SHA. `git ls-remote https://github.com/docker/setup-buildx-action refs/tags/v4`
        #   -> f87e5991a6d7451dcb8d9637bfbc97413f497069  (refs/tags/v4)
        # Verified `runs.using: 'node24'` at this SHA.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🏗️ Verify Dockerfile Compilation
        # Pinned by SHA. `git ls-remote https://github.com/docker/build-push-action refs/tags/v7`
        #   -> c3c9e263c25d99ce0380d002d59b67737d91b0dc  (refs/tags/v7)
        # Verified `runs.using: 'node24'` at this SHA, and that `context`, `push`,
        # `tags`, `cache-from` and `cache-to` are all still declared by this major
        # (refs/tags/v5 and refs/tags/v6 were still node20).
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: sovereign-commander-console:test-gate
          cache-from: type=gha
          cache-to: type=gha,mode=max
