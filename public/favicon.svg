<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0c162d"/>
      <stop offset="60%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="30%" stop-color="#0891b2"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Holographic Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Reactor Glow -->
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate (Square for maskable, rounded squircle for standard) -->
  <rect width="64" height="64" rx="11.52" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="0.512"/>

  <!-- Subtle Cybernetic Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.128">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>

  <!-- Orbital Sensor Ring -->
  <circle cx="32" cy="32" r="24.7808" fill="none" stroke="#1e3a5f" stroke-width="0.64" stroke-dasharray="3.2 1.28"/>
  <circle cx="32" cy="32" r="21.401600000000002" fill="none" stroke="#0284c7" stroke-width="0.384" opacity="0.4"/>

  <!-- Sovereign Shield Crest -->
  <g filter="url(#cyberGlow)">
    <!-- Outer Shield Frame -->
    <path d="M32 10.598399999999998 
             L50.022400000000005 20.735999999999997 
             L50.022400000000005 36.5056 
             C50.022400000000005 50.022400000000005 32 56.7808 32 56.7808 
             C32 56.7808 13.977599999999999 50.022400000000005 13.977599999999999 36.5056 
             L13.977599999999999 20.735999999999997 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="1.024" 
          stroke-linejoin="round"/>

    <!-- Inner Circuit Inset -->
    <path d="M32 15.104 
             L45.5168 23.552 
             L45.5168 35.3792 
             C45.5168 45.5168 32 51.712 32 51.712 
             C32 51.712 18.4832 45.5168 18.4832 35.3792 
             L18.4832 23.552 Z" 
          fill="#061224" 
          stroke="#06b6d4" 
          stroke-width="0.448" 
          opacity="0.85"/>
  </g>

  <!-- Quantum Chevron Sentinel Wings -->
  <g stroke="#38bdf8" stroke-width="0.64" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M21.8624 29.7472 L32 24.115199999999998 L42.1376 29.7472"/>
    <path d="M24.115199999999998 34.2528 L32 29.184 L39.8848 34.2528"/>
  </g>

  <!-- Central Fusion Energy Reactor (Node) -->
  <g filter="url(#intenseGlow)">
    <circle cx="32" cy="38.7584" r="5.0687999999999995" fill="url(#reactorCore)"/>
    <circle cx="32" cy="38.7584" r="2.2528" fill="#ffffff"/>
  </g>

  <!-- Crosshairs / Targeting Reticle Lines -->
  <g stroke="#ffffff" stroke-width="0.384" stroke-linecap="round" opacity="0.8">
    <line x1="32" y1="34.816" x2="32" y2="36.5056"/>
    <line x1="32" y1="41.0112" x2="32" y2="42.7008"/>
    <line x1="28.0576" y1="38.7584" x2="29.7472" y2="38.7584"/>
    <line x1="34.2528" y1="38.7584" x2="35.9424" y2="38.7584"/>
  </g>
</svg>