<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign Commander Console - وضع غير متصل</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(11, 16, 27, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      margin: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      color: #22d3ee;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #06b6d4;
      color: #07090e;
      border: none;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #22d3ee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">وضع عدم الاتصال (Offline Mode)</div>
    <h1>قمرة القيادة السيادية - انقطاع الاتصال</h1>
    <p>أنت حالياً غير متصل بشبكة الإنترنت. تم الاحتفاظ بالبيانات وسجلات المحادثة المخزنة محلياً في الذاكرة المعزولة وسيتم استئناف المزامنة فور استعادة الاتصال.</p>
    <button onclick="window.location.reload()">إعادة المحاولة والاتصال</button>
  </div>
</body>
</html>
