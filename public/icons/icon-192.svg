<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0c162d"/>
      <stop offset="60%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="30%" stop-color="#0891b2"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Holographic Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Reactor Glow -->
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.84" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.720000000000001" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate (Square for maskable, rounded squircle for standard) -->
  <rect width="192" height="192" rx="34.56" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.536"/>

  <!-- Subtle Cybernetic Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.384">
    <line x1="0" y1="48" x2="192" y2="48"/>
    <line x1="0" y1="96" x2="192" y2="96"/>
    <line x1="0" y1="144" x2="192" y2="144"/>
    <line x1="48" y1="0" x2="48" y2="192"/>
    <line x1="96" y1="0" x2="96" y2="192"/>
    <line x1="144" y1="0" x2="144" y2="192"/>
  </g>

  <!-- Orbital Sensor Ring -->
  <circle cx="96" cy="96" r="74.3424" fill="none" stroke="#1e3a5f" stroke-width="1.92" stroke-dasharray="9.600000000000001 3.84"/>
  <circle cx="96" cy="96" r="64.2048" fill="none" stroke="#0284c7" stroke-width="1.1520000000000001" opacity="0.4"/>

  <!-- Sovereign Shield Crest -->
  <g filter="url(#cyberGlow)">
    <!-- Outer Shield Frame -->
    <path d="M96 31.795199999999994 
             L150.0672 62.208 
             L150.0672 109.5168 
             C150.0672 150.0672 96 170.3424 96 170.3424 
             C96 170.3424 41.93279999999999 150.0672 41.93279999999999 109.5168 
             L41.93279999999999 62.208 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="3.072" 
          stroke-linejoin="round"/>

    <!-- Inner Circuit Inset -->
    <path d="M96 45.312 
             L136.5504 70.656 
             L136.5504 106.1376 
             C136.5504 136.5504 96 155.136 96 155.136 
             C96 155.136 55.4496 136.5504 55.4496 106.1376 
             L55.4496 70.656 Z" 
          fill="#061224" 
          stroke="#06b6d4" 
          stroke-width="1.344" 
          opacity="0.85"/>
  </g>

  <!-- Quantum Chevron Sentinel Wings -->
  <g stroke="#38bdf8" stroke-width="1.92" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M65.5872 89.2416 L96 72.34559999999999 L126.4128 89.2416"/>
    <path d="M72.34559999999999 102.7584 L96 87.55199999999999 L119.65440000000001 102.7584"/>
  </g>

  <!-- Central Fusion Energy Reactor (Node) -->
  <g filter="url(#intenseGlow)">
    <circle cx="96" cy="116.2752" r="15.2064" fill="url(#reactorCore)"/>
    <circle cx="96" cy="116.2752" r="6.758400000000001" fill="#ffffff"/>
  </g>

  <!-- Crosshairs / Targeting Reticle Lines -->
  <g stroke="#ffffff" stroke-width="1.1520000000000001" stroke-linecap="round" opacity="0.8">
    <line x1="96" y1="104.44800000000001" x2="96" y2="109.5168"/>
    <line x1="96" y1="123.0336" x2="96" y2="128.1024"/>
    <line x1="84.1728" y1="116.2752" x2="89.2416" y2="116.2752"/>
    <line x1="102.7584" y1="116.2752" x2="107.8272" y2="116.2752"/>
  </g>
</svg>