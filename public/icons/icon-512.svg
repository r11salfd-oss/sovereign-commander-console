<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0c162d"/>
      <stop offset="60%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="30%" stop-color="#0891b2"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Holographic Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Reactor Glow -->
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="17.92" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate (Square for maskable, rounded squircle for standard) -->
  <rect width="512" height="512" rx="92.16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4.096"/>

  <!-- Subtle Cybernetic Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.024">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Orbital Sensor Ring -->
  <circle cx="256" cy="256" r="198.2464" fill="none" stroke="#1e3a5f" stroke-width="5.12" stroke-dasharray="25.6 10.24"/>
  <circle cx="256" cy="256" r="171.21280000000002" fill="none" stroke="#0284c7" stroke-width="3.072" opacity="0.4"/>

  <!-- Sovereign Shield Crest -->
  <g filter="url(#cyberGlow)">
    <!-- Outer Shield Frame -->
    <path d="M256 84.78719999999998 
             L400.17920000000004 165.88799999999998 
             L400.17920000000004 292.0448 
             C400.17920000000004 400.17920000000004 256 454.2464 256 454.2464 
             C256 454.2464 111.82079999999999 400.17920000000004 111.82079999999999 292.0448 
             L111.82079999999999 165.88799999999998 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="8.192" 
          stroke-linejoin="round"/>

    <!-- Inner Circuit Inset -->
    <path d="M256 120.832 
             L364.1344 188.416 
             L364.1344 283.0336 
             C364.1344 364.1344 256 413.696 256 413.696 
             C256 413.696 147.8656 364.1344 147.8656 283.0336 
             L147.8656 188.416 Z" 
          fill="#061224" 
          stroke="#06b6d4" 
          stroke-width="3.584" 
          opacity="0.85"/>
  </g>

  <!-- Quantum Chevron Sentinel Wings -->
  <g stroke="#38bdf8" stroke-width="5.12" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M174.8992 237.9776 L256 192.92159999999998 L337.1008 237.9776"/>
    <path d="M192.92159999999998 274.0224 L256 233.472 L319.0784 274.0224"/>
  </g>

  <!-- Central Fusion Energy Reactor (Node) -->
  <g filter="url(#intenseGlow)">
    <circle cx="256" cy="310.0672" r="40.550399999999996" fill="url(#reactorCore)"/>
    <circle cx="256" cy="310.0672" r="18.0224" fill="#ffffff"/>
  </g>

  <!-- Crosshairs / Targeting Reticle Lines -->
  <g stroke="#ffffff" stroke-width="3.072" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="278.528" x2="256" y2="292.0448"/>
    <line x1="256" y1="328.0896" x2="256" y2="341.6064"/>
    <line x1="224.4608" y1="310.0672" x2="237.9776" y2="310.0672"/>
    <line x1="274.0224" y1="310.0672" x2="287.5392" y2="310.0672"/>
  </g>
</svg>