<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0c162d"/>
      <stop offset="60%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="30%" stop-color="#0891b2"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Holographic Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Reactor Glow -->
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="17.92" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate (Square for maskable, rounded squircle for standard) -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4.096"/>

  <!-- Subtle Cybernetic Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.024">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Orbital Sensor Ring -->
  <circle cx="256" cy="256" r="157.696" fill="none" stroke="#1e3a5f" stroke-width="5.12" stroke-dasharray="25.6 10.24"/>
  <circle cx="256" cy="256" r="136.19199999999998" fill="none" stroke="#0284c7" stroke-width="3.072" opacity="0.4"/>

  <!-- Sovereign Shield Crest -->
  <g filter="url(#cyberGlow)">
    <!-- Outer Shield Frame -->
    <path d="M256 119.80800000000002 
             L370.688 184.32 
             L370.688 284.672 
             C370.688 370.688 256 413.696 256 413.696 
             C256 413.696 141.312 370.688 141.312 284.672 
             L141.312 184.32 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="8.192" 
          stroke-linejoin="round"/>

    <!-- Inner Circuit Inset -->
    <path d="M256 148.48000000000002 
             L342.01599999999996 202.24 
             L342.01599999999996 277.504 
             C342.01599999999996 342.01599999999996 256 381.44 256 381.44 
             C256 381.44 169.984 342.01599999999996 169.984 277.504 
             L169.984 202.24 Z" 
          fill="#061224" 
          stroke="#06b6d4" 
          stroke-width="3.584" 
          opacity="0.85"/>
  </g>

  <!-- Quantum Chevron Sentinel Wings -->
  <g stroke="#38bdf8" stroke-width="5.12" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M191.488 241.664 L256 205.824 L320.512 241.664"/>
    <path d="M205.824 270.336 L256 238.08 L306.176 270.336"/>
  </g>

  <!-- Central Fusion Energy Reactor (Node) -->
  <g filter="url(#intenseGlow)">
    <circle cx="256" cy="299.008" r="32.256" fill="url(#reactorCore)"/>
    <circle cx="256" cy="299.008" r="14.335999999999999" fill="#ffffff"/>
  </g>

  <!-- Crosshairs / Targeting Reticle Lines -->
  <g stroke="#ffffff" stroke-width="3.072" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="273.92" x2="256" y2="284.672"/>
    <line x1="256" y1="313.344" x2="256" y2="324.096"/>
    <line x1="230.912" y1="299.008" x2="241.664" y2="299.008"/>
    <line x1="270.336" y1="299.008" x2="281.088" y2="299.008"/>
  </g>
</svg>